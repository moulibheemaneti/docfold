name: Bug report
description: Something isn't working as expected
labels: [bug]
body:
  - type: markdown
    attributes:
      value: |
        Thanks for taking the time to file a bug report. Please fill out each section below.

  - type: textarea
    id: description
    attributes:
      label: What happened?
      description: A clear description of the bug.
    validations:
      required: true

  - type: textarea
    id: reproduction
    attributes:
      label: Steps to reproduce
      description: Minimal steps that reliably reproduce the issue. A small markdown file that triggers it helps a lot.
      placeholder: |
        1. Add a markdown file with the following front matter …
        2. Run `bunx docfold build`
        3. Open the page in the browser
        4. See error
    validations:
      required: true

  - type: textarea
    id: expected
    attributes:
      label: Expected behaviour
    validations:
      required: true

  - type: textarea
    id: actual
    attributes:
      label: Actual behaviour
      description: Include the full error output / stack trace if available.
    validations:
      required: true

  - type: textarea
    id: config
    attributes:
      label: docfold.config.ts
      description: Paste your `docfold.config.ts` if you have one (redact anything sensitive).
      render: ts

  - type: dropdown
    id: command
    attributes:
      label: Command
      description: Which command shows the problem?
      multiple: true
      options:
        - docfold dev
        - docfold build
        - docfold preview
        - Programmatic API

  - type: input
    id: docfold_version
    attributes:
      label: docfold version
      placeholder: "0.1.0"
    validations:
      required: true

  - type: input
    id: runtime_version
    attributes:
      label: Bun version
      description: Output of `bun --version`.
      placeholder: "1.4.x"
    validations:
      required: true

  - type: input
    id: os
    attributes:
      label: Operating system
      placeholder: "macOS 15, Ubuntu 24.04, Windows 11…"
    validations:
      required: true

  - type: input
    id: browser
    attributes:
      label: Browser
      description: Only if the problem is in the generated site (search, filters, sidebar…).
      placeholder: "Chrome 140, Safari 26, Firefox 145…"
