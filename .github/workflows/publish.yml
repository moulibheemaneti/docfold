name: Publish to npm

on:
  release:
    types: [published]

jobs:
  publish:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write  # lets npm trusted publishing verify this workflow (and sign provenance)
    steps:
      - uses: actions/checkout@v4

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2

      # Trusted publishing needs npm 11.5.1 or newer; the current Node LTS ships with it.
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: lts/*
          registry-url: https://registry.npmjs.org

      - name: Install dependencies
        run: bun install --frozen-lockfile

      # docfold ships its TypeScript sources as-is (Bun runs them), so there is no build step.
      # Check them instead before they go out.
      - name: Typecheck
        run: bun run typecheck

      - name: Test
        run: bun test

      # No token: npm trusts this workflow through trusted publishing, set up on npmjs.com under
      # the package's Settings → Trusted publishing (GitHub Actions, moulibheemaneti/docfold, publish.yml).
      - name: Publish to npm
        run: npm publish --provenance --access public
